name: Deploy FL2S

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fl2s
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ============================================================
      # BUILD
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Le build a échoué : dist/index.html introuvable."
            exit 1
          fi

          du -sh dist
          ls -la dist

      # ============================================================
      # GITHUB PAGES
      #
      # Cible par défaut.
      #
      # DEPLOY_TARGET possible :
      # github
      # ftp
      # ============================================================

      - name: Setup GitHub Pages
        if: vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'github'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'github'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy GitHub Pages
        id: deployment
        if: vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'github'
        uses: actions/deploy-pages@v4

      # ============================================================
      # FTP
      #
      # Utilisé lorsque :
      # DEPLOY_TARGET = ftp
      # ============================================================

      - name: Deploy to FTP
        if: vars.DEPLOY_TARGET == 'ftp'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          protocol: ftps
          security: loose
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Summary GitHub Pages
        if: success() && (vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'github')
        run: |
          echo "### ✅ Déploiement FL2S terminé" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Cible : GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "- Commit : \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Summary FTP
        if: success() && vars.DEPLOY_TARGET == 'ftp'
        run: |
          echo "### ✅ Déploiement FL2S terminé" >> $GITHUB_STEP_SUMMARY
          echo "- 🖥️ Cible : serveur FTP" >> $GITHUB_STEP_SUMMARY
          echo "- Commit : \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
